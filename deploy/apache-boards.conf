# Boards — an application from us beside the Business OS kernel. Rendered by the kernel's installer (bin/app_install.php):
# {{APP_FQDN}} = boards.<domain>, {{APP_DIR}} = /srv/apps/boards, the ports from config/.env (pinned by deploy/ROOT_STEPS.sh step 0).
# Two virtual hosts: the public name for people (the screens, the canvas's JSON doors under the session, the live socket, the proxied
# MCP servers), and a loopback port for the kernel's actions server and approval replays.
#
# THE PUBLIC ALLOW-LIST (design §8, §14): /live (the relay — a 60-second ticket the board page minted is its authority, checked by the
# relay; design §3), /mcp/records, /mcp/activity, /api/v1/health. Every screen and every board door needs the kernel's sign-on.
# THE LIVE DOOR (decision record §3.4, §6.1): Apache 2.4.47+ mod_proxy_http tunnels the WebSocket upgrade itself to an http:// backend —
# proxy_wstunnel is NOT needed (proven by the realtime spike, 2026-10-10, on this host's 2.4.58). The front proxy (Nginx Proxy Manager)
# must have "Websockets Support" on for boards.<domain> (ROOT_STEPS step 4). The client pings every 25 s; timeout=120 is the idle
# ceiling of one tunnel.
# Uploads: an image or a file on the canvas is at most 25 MB (D9; bd_settings.max_upload_mb).

<VirtualHost *:80>
	ServerName {{APP_FQDN}}
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/boards-error.log
	CustomLog ${APACHE_LOG_DIR}/boards-access.log combined
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on
	LimitRequestBody 33554432
	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
	</IfModule>

	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
		php_admin_value upload_max_filesize 26M
		php_admin_value post_max_size 32M
		php_admin_value max_execution_time 60
		php_admin_value memory_limit 256M
	</Directory>

	# The live socket (the relay, boards-live.service), and the two read MCP servers, under the application's name. Host is NOT preserved
	# for the MCP servers (the SDK's DNS-rebinding guard checks it against loopback). Bearer auth is the servers' own.
	ProxyPreserveHost Off
	ProxyPass        /live         http://127.0.0.1:{{BOARDS_LIVE_PORT}}/ upgrade=websocket timeout=120
	ProxyPass        /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPassReverse /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPass        /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp
	ProxyPassReverse /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp

	RewriteEngine On
	RewriteRule ^/live(/|$) - [L]
	RewriteRule ^/mcp/(records|activity)(/|$) - [L]
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/api/ - [R=404,L]

	# The sign-on receivers.
	RewriteRule ^/sso$ /sso.php [L,QSA]
	RewriteRule ^/sso/logout$ /sso/logout.php [L,QSA]

	# A board by its uuid, and its pages and doors (/boards/{board}/share, /state, /ops, /live-ticket, /files, /thumbnail …);
	# a template by its uuid. (tests/dev_router.php routes the same.)
	RewriteRule ^/boards/([0-9a-f-]{36})/?$ /boards/view.php?board=$1 [L,QSA]
	RewriteRule ^/boards/([0-9a-f-]{36})/([a-z-]+)/?$ /boards/$2.php?board=$1 [L,QSA]
	RewriteRule ^/templates/([0-9a-f-]{36})/?$ /templates/view.php?board=$1 [L,QSA]

	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]

	# Canonical URLs (the action manifest, Phase 1): /x/new -> form.php, /x/{id}/edit -> form.php?id=, /x/{id} -> view.php?id=.
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>

# PHP on the internal port, for the kernel's actions server and approval replays only (no socket, no MCP).
Listen 127.0.0.1:{{APP_INTERNAL_PORT}}
<VirtualHost 127.0.0.1:{{APP_INTERNAL_PORT}}>
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/boards-error.log
	CustomLog ${APACHE_LOG_DIR}/boards-access.log combined
	LimitRequestBody 33554432
	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
	</IfModule>
	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
		php_admin_value upload_max_filesize 26M
		php_admin_value post_max_size 32M
		php_admin_value max_execution_time 60
		php_admin_value memory_limit 256M
	</Directory>
	RewriteEngine On
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/boards/([0-9a-f-]{36})/?$ /boards/view.php?board=$1 [L,QSA]
	RewriteRule ^/boards/([0-9a-f-]{36})/([a-z-]+)/?$ /boards/$2.php?board=$1 [L,QSA]
	RewriteRule ^/templates/([0-9a-f-]{36})/?$ /templates/view.php?board=$1 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>
